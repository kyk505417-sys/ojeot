<title>짭짤한 녀석들의 방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap">
<style>
/* Layout: one-screen phone app — status chips, cozy pastel room scene, four soft gauges, category buttons that open a sub-menu, today's routine list by morning/lunch/evening */
:root{
  --bg:#f7f0ff; --card:#ffffff; --ink:#5d4b7a; --muted:#a497bd; --line:#eadff7;
  --pink:#ff8fab; --pink-d:#e86f8e; --lamp:#ffd27a; --lamp-d:#f0b85a;
  --full:#ffb35c; --clean:#7cc8f2; --mood:#ff9fbf; --hp:#7fd1a6;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);word-break:keep-all;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.top h1{font-size:22px;font-weight:400;margin:0 4px 0 0}
.chip{font-size:13px;background:#fff;border-radius:99px;padding:4px 11px;box-shadow:0 2px 0 var(--line);white-space:nowrap}
.chip.time{color:var(--pink-d)}
.snd{margin-left:auto;border:0;background:#fff;border-radius:99px;padding:5px 11px;font-size:12px;box-shadow:0 2px 0 var(--line)}
.room{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 4px 0 var(--line);background:#efe4ff;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.room svg.bg{display:block;width:100%;height:auto}
.dim{position:absolute;inset:0;pointer-events:none;background:#5a4aa6;opacity:0;transition:opacity .8s}
.wx{position:absolute;left:41.7%;top:10.6%;width:21.1%;height:23.2%;pointer-events:none;overflow:hidden;border-radius:4px}
.wx.rain{background-image:repeating-linear-gradient(105deg,rgba(255,255,255,0) 0 7px,rgba(255,255,255,.75) 7px 8px);background-size:22px 22px;animation:rain .45s linear infinite}
.wx.snow{background-image:radial-gradient(circle,#fff 0 1.6px,transparent 2px),radial-gradient(circle,#fff 0 1.2px,transparent 1.6px);background-size:16px 16px,11px 11px;background-position:0 0,5px 7px;animation:snow 2.4s linear infinite}
@keyframes rain{to{background-position:-6px 22px}}
@keyframes snow{to{background-position:6px 32px,10px 29px}}
.hot{position:absolute;border:0;background:transparent;padding:0}
.char{position:absolute;width:19%;transform:translateX(-50%);transition:left .8s ease-in-out,bottom .8s ease-in-out,opacity .5s;z-index:3}
.char svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 5px 4px rgba(120,90,160,.25))}
.char.bob svg{animation:bob .45s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5%)}}
.char.jump svg{animation:jump .3s ease-in-out infinite alternate}
@keyframes jump{to{transform:translateY(-12%) scaleY(1.03)}}
.char.brr svg{animation:brr .07s linear infinite alternate;transform-origin:50% 90%}
@keyframes brr{from{transform:translateX(-2%) rotate(-2deg)}to{transform:translateX(2%) rotate(2deg)}}
.char.sway svg{animation:sway .5s ease-in-out infinite alternate;transform-origin:50% 95%}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.char.lie svg{transform:rotate(-82deg);transform-origin:50% 60%}
.char.sit svg{transform:scaleY(.94);transform-origin:50% 100%}
.char.pat svg{animation:pat .18s ease-out;transform-origin:50% 100%}
@keyframes pat{50%{transform:scale(1.05,.94)}}
.char .lift{animation:lift .5s ease-in-out infinite alternate}
@keyframes lift{to{transform:translateY(-14px)}}
.dog{position:absolute;width:12%;transform:translateX(-50%);transition:left .7s ease-in-out,bottom .5s;z-index:2}
.dog svg{display:block;width:100%;height:auto;overflow:visible}
.dog.flip svg{transform:scaleX(-1)}
.dog.wag .tail{animation:wag .18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}
@keyframes wag{from{transform:rotate(-20deg)}to{transform:rotate(25deg)}}
.dog.hop svg{animation:hop .28s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-14%)}}
.dog.roll svg{animation:roll 1s ease-in-out}
@keyframes roll{to{transform:rotate(360deg)}}
.dog.sleep svg{transform:scaleY(.86);transform-origin:50% 100%}
.friend{position:absolute;width:16%;transform:translateX(-50%);transition:left 1s ease-in-out,opacity .5s;z-index:3}
.friend img{width:100%;display:block;filter:drop-shadow(0 5px 4px rgba(120,90,160,.25))}
.ball{position:absolute;width:4.5%;z-index:4;pointer-events:none}
.parcel{position:absolute;width:10%;left:10%;bottom:6%;z-index:4;border:0;background:none;padding:0;animation:bob .5s ease-in-out infinite alternate}
.mess{position:absolute;width:9%;min-width:34px;border:0;background:none;padding:0;z-index:5;animation:bob .6s ease-in-out infinite alternate}
.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 0 25%,rgba(200,230,255,.75) 60%,rgba(170,210,255,.5));border:1.5px solid rgba(255,255,255,.9);pointer-events:none;animation:bub 1.6s ease-out forwards;z-index:5}
@keyframes bub{0%{transform:scale(.3);opacity:1}100%{transform:translateY(-30px) scale(1.1);opacity:0}}
.panel{position:absolute;left:8px;right:8px;top:8px;background:rgba(255,255,255,.95);border-radius:14px;padding:8px 12px;font-size:14px;text-align:center;z-index:6;box-shadow:0 3px 10px rgba(120,90,160,.15)}
.panel .bar{height:8px;border-radius:99px;background:#f0e8fb;margin-top:6px;overflow:hidden}
.panel .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9fdcff,#ff9fbf);transition:width .15s}
.panel .row{margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.clock{font-size:26px;font-variant-numeric:tabular-nums;color:var(--pink-d)}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.g{background:var(--card);border-radius:14px;padding:7px 8px;box-shadow:0 3px 0 var(--line)}
.g .lab{display:flex;justify-content:space-between;font-size:12px}
.g .lab b{font-weight:400;font-variant-numeric:tabular-nums;color:var(--muted)}
.g .bar{height:7px;border-radius:99px;background:#f3ecfb;margin-top:5px;overflow:hidden}
.g .bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.menu{background:var(--card);border-radius:20px;padding:10px;box-shadow:0 3px 0 var(--line)}
.mhead{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-size:16px}
.back{border:0;background:#f3ecff;border-radius:99px;padding:5px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.a{position:relative;border:0;background:#fbf8ff;border-radius:14px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 2px 0 var(--line)}
.a svg{width:34px;height:34px}
.a span{font-size:14px}
.a small{font-size:10px;color:var(--muted)}
.a:active{transform:translateY(2px);box-shadow:none}
.a[disabled]{opacity:.4;pointer-events:none}
.a .dot{position:absolute;right:8px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 2px #fff}
.big{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.big .a{flex-direction:row;justify-content:center;gap:8px;padding:10px}
.big .a svg{width:28px;height:28px}
.todo{background:var(--card);border-radius:20px;padding:10px 12px;box-shadow:0 3px 0 var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;border:0;border-radius:12px;padding:7px 0;background:#f6f2fb;color:var(--muted);font-size:14px}
.tabs button[aria-selected="true"]{background:var(--pink);color:#fff}
.tabs button.now::after{content:" ●";font-size:9px;vertical-align:middle}
.todo ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.todo li{display:flex;align-items:center;gap:8px;font-size:14px}
.todo li .ck{width:20px;height:20px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none;color:#fff}
.todo li.done .ck{background:var(--hp);border-color:var(--hp)}
.todo li.done span{color:var(--muted);text-decoration:line-through}
.todo li em{margin-left:auto;font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rules{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:10px 18px;font-size:16px;background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-d);text-decoration:none}
.btn.sm{padding:7px 14px;font-size:14px}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:none;border:2px solid var(--line)}
.btn.lamp{background:var(--lamp);color:#6a4a1a;box-shadow:0 4px 0 var(--lamp-d)}
.btn:active{transform:translateY(2px)}
.ono{position:fixed;z-index:70;pointer-events:none;font-family:"Gaegu","Jua",sans-serif;font-weight:700;font-size:28px;color:#fff;-webkit-text-stroke:6px #ff7d93;paint-order:stroke fill;white-space:nowrap;transform:translate(-50%,-50%);animation:ono .9s cubic-bezier(.2,1.6,.4,1) forwards}
.ono.blue{-webkit-text-stroke-color:#5aa9e6}.ono.gold{-webkit-text-stroke-color:#f0b23e}.ono.purple{-webkit-text-stroke-color:#9b7ae0}.ono.green{-webkit-text-stroke-color:#4fae78}.ono.brown{-webkit-text-stroke-color:#b98055}
@keyframes ono{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-80%) scale(1.15);opacity:1}100%{transform:translate(-50%,-140%) scale(.95);opacity:0}}
.float{position:fixed;z-index:66;pointer-events:none;width:34px;height:34px;animation:fl 1.6s ease-out forwards}
.float svg{width:100%;height:100%}
@keyframes fl{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}20%{opacity:1;transform:translate(calc(-50% + var(--dx)*.3),-70%) scale(1)}100%{transform:translate(calc(-50% + var(--dx)),-260%) rotate(var(--r));opacity:0}}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#fff;border-radius:14px;padding:9px 16px;z-index:80;box-shadow:0 8px 20px rgba(90,60,130,.25);max-width:92%;text-align:center;font-size:15px;animation:tin .25s ease-out}
@keyframes tin{from{transform:translate(-50%,-10px);opacity:0}}
.modal{position:fixed;inset:0;z-index:75;background:rgba(60,40,100,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fffaf6;width:100%;max-width:480px;max-height:86%;overflow:auto;border-radius:24px 24px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet h3{margin:0;font-size:22px;font-weight:400}
.sheet .sub{margin:0;font-size:13px;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mitem{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.mitem svg{width:48px;height:48px}
.mitem span{font-size:14px}.mitem small{font-size:11px;color:var(--muted)}
.wdprev{height:170px;display:grid;place-items:center;background:linear-gradient(180deg,#e7defe,#ffe6ef);border-radius:16px}
.wdprev svg{height:160px;width:auto}
.wdgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.wditem{border:2px solid var(--line);background:#fff;border-radius:14px;padding:5px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.wditem svg{width:100%;max-width:52px;aspect-ratio:1/1;height:auto}
.wditem span{font-size:10px;line-height:1.25;text-align:center}
.wditem.on{border-color:var(--pink);box-shadow:0 0 0 3px #ffe0e9}
.diary{background:#fff;border-radius:16px;padding:14px;font-size:15px;line-height:1.7;box-shadow:inset 0 0 0 2px var(--line);background-image:repeating-linear-gradient(transparent 0 25px,#f1e9fb 25px 26px)}
.fw{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:76;animation:fw 1.3s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes fw{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.germ{position:absolute;right:-14%;top:34%;width:34%;animation:bob .5s ease-in-out infinite alternate;pointer-events:none}
.germ svg{width:100%;height:auto;filter:none}
.greet{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:7}
.char.bow svg{transform:rotate(18deg);transform-origin:50% 95%;transition:transform .25s}
.stampgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11px;color:var(--muted)}
.st .c{width:58px;height:58px;border-radius:50%;border:2.5px dashed #e3d6f5;display:grid;place-items:center;background:#fff}
.st.on .c{border:3px solid #ff9fbf;background:#fff0f5}
.st.on .c img{width:40px;transform:rotate(-12deg)}
.st.on{color:var(--ink)}
.chk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.chk li{display:flex;gap:8px;align-items:center}
.chk li i{width:20px;height:20px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff;flex:none}
.chk li.ok i{background:var(--hp);border-color:var(--hp)}
.hb-title{font-size:14px;margin:12px 0 6px;display:flex;justify-content:space-between;align-items:center}
.chip.stamp{border:0;font:inherit;color:var(--pink-d);cursor:pointer}
.chip.who{border:0;font:inherit;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:2px 10px 2px 4px}
.chip.who img{height:24px;width:auto}
.whogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.whob{border:2px solid var(--line);background:#fff;border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px}
.whob img{height:86px;width:auto}
.whob small{font-size:11px;color:var(--muted);text-align:center;line-height:1.35}
.whob[aria-pressed="true"]{border-color:var(--pink);box-shadow:0 0 0 3px #ffe0e9}
.wditem.lock svg{opacity:.18;filter:grayscale(1)}
.wditem.lock span{color:var(--muted)}
.gift{position:absolute;width:10%;left:10%;bottom:6%;z-index:4;border:0;background:none;padding:0;animation:bob .5s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <div class="top"><h1>짭짤한 녀석들의 방</h1><button class="chip who" id="cWho"></button><span class="chip" id="cDay">1일차</span><span class="chip time" id="cTime">아침 · 오전 7:00</span><span class="chip" id="cWx">맑음</span><button class="chip stamp" id="cStamp">도장 0/7</button><button class="snd" id="snd" aria-pressed="true">소리 켜짐</button></div>
  <div class="room" id="room">
    <svg class="bg" id="bg" viewBox="0 0 360 320" aria-label="오젓군의 방"></svg>
    <div class="wx" id="wx"></div>
    <div class="dim" id="dim"></div>
    <div class="dog" id="dog"></div>
    <div class="char" id="char"></div>
    <div class="panel" id="panel" hidden></div>
  </div>
  <div class="gauges" id="gauges"></div>
  <div class="menu" id="menu"></div>
  <div class="todo" id="todo"></div>
</div>

const PERIODS=[["새벽",0,6],["아침",6,11],["점심",11,17],["저녁",17,22],["밤",22,30]];
function period(t){const h=(t/60)%24;const H=t/60;if(H>=24)return "새벽";return (PERIODS.find(([n,a,b])=>h>=a&&h<b)||["밤"])[0]}

function ac(){if(!SOUND)return null;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC}catch(e){return null}}
function tone(f,t0,dur,type,vol){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(t0||0);o.type=type||"sine";o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.06,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.02)}
const bell=(f,t,d,v)=>{tone(f,t,d,"sine",v);tone(f*2.005,t,d*.6,"sine",v*.28)};

<script>
/* 축제·행사 배너: 깃허브 ojeot 저장소의 events.json 을 읽어서 기간에 맞으면 띄워요 */
(function(){
var URL_EV="https://kyk505417-sys.github.io/ojeot/events.json";
var css=".evb{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#fff0f5,#fff7df);border-radius:16px;padding:10px 12px;margin:0 0 10px;box-shadow:0 3px 0 #eadff7;font-family:'Jua',sans-serif;color:#5d4b7a;text-decoration:none;position:relative}"+
".evb .d{flex:none;background:#ff8fab;color:#fff;border-radius:12px;padding:6px 8px;font-size:14px;min-width:54px;text-align:center}"+
".evb b{display:block;font-weight:400;font-size:16px;line-height:1.3}.evb small{display:block;font-size:12px;color:#a497bd;margin-top:2px}"+
".evb .x{margin-left:auto;flex:none;border:0;background:#fff;border-radius:50%;width:28px;height:28px;font-size:13px;color:#a497bd;cursor:pointer}";
function day(s){var p=String(s||"").trim().split(/[-.\/]/).map(Number);if(p.length<3||!p[0])return null;return new Date(p[0],p[1]-1,p[2])}
function md(d){return (d.getMonth()+1)+"/"+d.getDate()}
function show(list){if(!Array.isArray(list)||!list.length)return;var t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());
 var hid={};try{hid=JSON.parse(localStorage.getItem("ojeot-ev-hide")||"{}")}catch(e){}
 var cur=list.map(function(e){var a=day(e["시작"]),b=day(e["끝"])||a;if(!a)return null;var pre=Number(e["미리알림일"]);if(isNaN(pre))pre=14;
   var from=new Date(a.getTime()-pre*864e5);if(t<from||t>b)return null;var dd=Math.round((a-t)/864e5);return {e:e,a:a,b:b,dd:dd,key:(e["제목"]||"")+e["시작"]}})
  .filter(function(x){return x&&hid[x.key]!==t.toDateString()}).sort(function(x,y){return x.a-y.a});
 if(!cur.length)return;var x=cur[0],e=x.e,app=document.querySelector(".app")||document.body;
 var st=document.createElement("style");st.textContent=css;document.head.appendChild(st);
 var el=document.createElement(e["링크"]?"a":"div");el.className="evb";if(e["링크"]){el.href=e["링크"];el.target="_blank";el.rel="noopener"}
 var badge=x.dd>0?"D-"+x.dd:"진행 중";
 el.innerHTML='<span class="d">'+badge+'</span><span><b></b><small></small></span><button class="x" aria-label="오늘은 닫기">✕</button>';
 el.querySelector("b").textContent=e["제목"]||"행사 소식";
 el.querySelector("small").textContent=[md(x.a)+(x.b>x.a?" ~ "+md(x.b):""),e["장소"]].filter(Boolean).join(" · ");
 el.querySelector(".x").addEventListener("click",function(ev){ev.preventDefault();ev.stopPropagation();hid[x.key]=t.toDateString();try{localStorage.setItem("ojeot-ev-hide",JSON.stringify(hid))}catch(_){}el.remove()});
 app.insertBefore(el,app.firstChild)}
try{fetch(URL_EV+"?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(show).catch(function(){})}catch(e){}
})();
</script>
